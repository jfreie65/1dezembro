<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão 1640 – Os Conjurados da Restauração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0d5c3a; --verde2:#127a4d; --vermelho:#b3202a; --vermelho2:#d63a3a;
  --ouro:#d9a520; --ouro2:#f3cf5c; --perg:#f7ecd0; --perg2:#ead7a8; --tinta:#2d1e0f;
  --sombra:0 6px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#0b4a30}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--tinta); min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.08) 0 2px, transparent 3px) 0 0/40px 40px,
    linear-gradient(160deg,#08402a 0%,#0d5c3a 45%,#6e1219 100%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer}
.titulo{font-family:'Cinzel Decorative','Cinzel',Georgia,serif}
.cinzel{font-family:'Cinzel',Georgia,serif}

/* barra superior */
#barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  padding:.5rem .8rem;background:rgba(20,10,5,.82);color:#fff;backdrop-filter:blur(4px);border-bottom:3px solid var(--ouro)}
#barra .quem{display:flex;align-items:center;gap:.4rem;font-weight:800}
#barra .quem .av{font-size:1.5rem}
#barra .pts{background:var(--ouro);color:#3a2500;border-radius:99px;padding:.15rem .7rem;font-weight:800}
#barra .selos{font-size:1.15rem;letter-spacing:.1rem}
#barra .esp{flex:1}
.bt-ic{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;
  padding:.3rem .6rem;font-size:1rem;font-weight:700}
.bt-ic.off{opacity:.45;text-decoration:line-through}
.bt-ic:hover{background:rgba(255,255,255,.25)}

#app{max-width:980px;margin:0 auto;padding:1rem .8rem 3rem}

/* pergaminho */
.perg{background:linear-gradient(180deg,var(--perg),var(--perg2));border-radius:18px;padding:1.4rem 1.3rem;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 3px rgba(120,80,20,.25), inset 0 0 40px rgba(150,100,30,.25);
  position:relative}
.perg h1,.perg h2{margin:.2rem 0 .6rem}
.centro{text-align:center}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;border-radius:14px;
  padding:.75rem 1.3rem;font-size:1.08rem;font-weight:800;color:#fff;background:var(--verde2);box-shadow:var(--sombra);
  transition:transform .08s}
.bt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bt.verm{background:var(--vermelho)}
.bt.ouro{background:var(--ouro);color:#3a2500}
.bt.cinza{background:#7b6a55}
.bt:disabled{opacity:.5;cursor:default}
.bt-ouvir{background:#fff7;border:2px solid #8a6a2a;color:#5a3c00;border-radius:99px;padding:.3rem .8rem;font-weight:800;font-size:.95rem}
.bt-ouvir:hover{background:#fff}

/* início */
.escudo{font-size:4.2rem;line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.avatares{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.avatares button{font-size:2rem;width:3.6rem;height:3.6rem;border-radius:14px;border:3px solid transparent;background:#fff8}
.avatares button.sel{border-color:var(--vermelho);background:#fff;transform:scale(1.08)}
input.nome{font:inherit;font-size:1.15rem;padding:.6rem .9rem;border-radius:12px;border:3px solid #a8823a;width:min(320px,90%);text-align:center;background:#fffdf5}

/* mapa */
.grelha-missoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:1rem}
.missao-cartao{border:none;text-align:left;border-radius:18px;padding:1rem;background:linear-gradient(180deg,#fffaf0,#efdcae);
  box-shadow:0 6px 0 #8a6a2a, 0 10px 20px rgba(0,0,0,.3);display:flex;gap:.8rem;align-items:center;position:relative;color:var(--tinta)}
.missao-cartao:hover{transform:translateY(-2px)}
.missao-cartao .n{font-size:2.6rem;width:3.4rem;text-align:center}
.missao-cartao h3{margin:0;font-family:'Cinzel',serif;font-size:1.05rem}
.missao-cartao p{margin:.2rem 0 0;font-size:.92rem}
.missao-cartao .feito{position:absolute;top:-10px;right:-8px;font-size:1.9rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.missao-cartao.bloq{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.missao-cartao.final{grid-column:1/-1;background:linear-gradient(180deg,#fff3c4,#e9c25a);box-shadow:0 6px 0 #8a5a00,0 10px 20px rgba(0,0,0,.3)}

.cab-missao{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.cab-missao h2{flex:1;margin:0;font-family:'Cinzel',serif;color:var(--vermelho)}
.prog{height:12px;background:#0002;border-radius:99px;overflow:hidden;margin:.4rem 0 1rem}
.prog>div{height:100%;background:linear-gradient(90deg,var(--verde2),var(--ouro));transition:width .4s}

/* crónica */
.pagina{display:grid;grid-template-columns:120px 1fr;gap:1rem;align-items:start}
.pagina .ano{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:var(--vermelho);text-align:center}
.pagina .ic{font-size:4rem;text-align:center;line-height:1.1}
.pagina .texto{font-size:1.12rem;line-height:1.55}
.pagina .texto b{color:var(--verde)}
@media (max-width:600px){.pagina{grid-template-columns:1fr}.pagina .ic{font-size:3rem}}
.pergunta{margin-top:1rem;padding:1rem;border-radius:14px;background:#fff8;border:2px dashed #a8823a}
.pergunta .q{font-weight:800;font-size:1.1rem;margin-bottom:.6rem}
.opcoes{display:grid;gap:.55rem}
.op{border:3px solid #a8823a;background:#fffdf5;border-radius:12px;padding:.65rem .9rem;font-size:1.03rem;font-weight:700;text-align:left;color:var(--tinta)}
.op:hover:not(:disabled){background:#fff3cf}
.op.certa{background:#c9f0d4;border-color:var(--verde2)}
.op.errada{background:#f8c9c9;border-color:var(--vermelho);opacity:.75}
.feedback{margin-top:.6rem;font-weight:800;min-height:1.4em}
.feedback.ok{color:var(--verde)} .feedback.ko{color:var(--vermelho)}

/* linha do tempo */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem;position:relative}
@media (max-width:700px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{min-height:92px;border:3px dashed #a8823a;border-radius:12px;padding:.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff5;font-size:.88rem}
.slot .num{font-family:'Cinzel',serif;font-weight:800;color:#a8823a;font-size:1.3rem}
.slot.cheio{background:#e3f6e8;border-style:solid;border-color:var(--verde2);animation:pop .35s}
.slot .data{font-family:'Cinzel',serif;font-weight:800;color:var(--vermelho);font-size:1rem}
.baralho{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.ev{width:200px;min-height:96px;border:none;border-radius:14px;padding:.6rem;background:#fffdf5;box-shadow:0 5px 0 #8a6a2a;font-weight:700;font-size:.95rem;color:var(--tinta)}
.ev .e{font-size:1.8rem;display:block}
.ev:hover{background:#fff3cf}
.abanar{animation:abana .4s}
@keyframes abana{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* memória */
.memoria{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;perspective:900px;max-width:640px;margin:0 auto}
@media (max-width:560px){.memoria{gap:.35rem}.carta{aspect-ratio:3/4.6}.carta.pista .frente .em{display:none}.carta .frente{padding:.2rem;font-size:.66rem;border-width:3px}}
.carta{position:relative;aspect-ratio:3/3.4;border:none;background:none;padding:0;transform-style:preserve-3d;transition:transform .45s}
.carta.virada,.carta.feita{transform:rotateY(180deg)}
.carta .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.35rem;text-align:center}
.carta .verso{background:repeating-linear-gradient(45deg,var(--verde) 0 12px,var(--verde2) 12px 24px);border:4px solid var(--ouro);box-shadow:0 5px 0 #063a24;color:var(--ouro2);font-size:2.2rem}
.carta .frente{transform:rotateY(180deg);background:#fffdf5;border:4px solid #a8823a;box-shadow:0 5px 0 #8a6a2a;font-size:clamp(.68rem,1.9vw,.95rem);font-weight:800;color:var(--tinta)}
.carta .frente .em{font-size:clamp(1.4rem,5vw,2.4rem)}
.carta.pessoa .frente{background:#fff3d6}
.carta.feita .frente{border-color:var(--verde2);background:#dff5e5}
.info-par{margin-top:.8rem;padding:.7rem 1rem;border-radius:12px;background:#fff9;border-left:6px solid var(--verde2);min-height:3rem;font-size:1.02rem}

/* paço */
.paco{display:grid;grid-template-columns:200px 1fr;gap:1rem;align-items:start}
@media (max-width:700px){.paco{grid-template-columns:1fr}}
.escadaria{position:relative;height:300px;background:linear-gradient(180deg,#cfe7ff,#f6e8c6);border-radius:14px;overflow:hidden;border:3px solid #a8823a}
@media (max-width:700px){.escadaria{height:180px}}
.degrau{position:absolute;height:10%;background:#b89b6a;border-top:3px solid #8a6a2a}
.porta{position:absolute;right:8px;top:6px;font-size:2.4rem}
.boneco{position:absolute;font-size:2rem;transition:left .6s, bottom .6s;z-index:2}
.vidas{font-size:1.5rem;letter-spacing:.2rem}
.relogio{font-weight:900;font-size:1.3rem;color:var(--vermelho);font-family:'Cinzel',serif}
.barra-tempo{height:10px;border-radius:99px;background:#0002;overflow:hidden;margin:.3rem 0 .8rem}
.barra-tempo>div{height:100%;background:var(--vermelho2);transition:width 1s linear}

/* salga */
.praia{position:relative;height:230px;border-radius:14px;overflow:hidden;border:3px solid #a8823a;
  background:linear-gradient(90deg,#2a7fc4 0 22%,#e9d29a 22% 60%,#7cb35a 60% 100%)}
.praia .onda{position:absolute;left:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(180deg,transparent 0 16px,rgba(255,255,255,.35) 16px 19px);animation:ondas 3s linear infinite}
@keyframes ondas{to{background-position:0 38px}}
.praia .navio{position:absolute;left:2%;top:8px;font-size:2.3rem}
.praia .aldeia{position:absolute;right:3%;top:50%;transform:translateY(-50%);font-size:2.6rem;text-align:center;line-height:1}
.praia .aldeia small{display:block;font-size:.7rem;font-weight:900;color:#1b3b10;background:#fff9;border-radius:6px;padding:0 .3rem}
.soldado{position:absolute;font-size:1.9rem;transition:left .7s, top .7s, opacity .6s, transform .6s}
.soldado.fora{opacity:0;transform:translateX(-120px) rotate(-90deg)}
.touro{position:absolute;font-size:2.6rem;right:20%;top:40%;z-index:3;transform:scaleX(1)}
.touro.ataca{animation:carga 1.1s ease-in forwards}
@keyframes carga{0%{right:20%;opacity:1}100%{right:88%;opacity:0}}
.vf{display:flex;gap:.8rem;justify-content:center;margin-top:.8rem;flex-wrap:wrap}
.vf .bt{min-width:150px;font-size:1.15rem}
.afirmacao{font-size:1.18rem;font-weight:800;text-align:center;padding:.9rem;background:#fff9;border-radius:12px;margin-top:.8rem;min-height:4.5rem;display:flex;align-items:center;justify-content:center}

/* código */
.chave{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:.8rem 0}
@media (max-width:600px){.chave{grid-template-columns:repeat(7,1fr)}}
.chave div{background:#fffdf5;border:2px solid #a8823a;border-radius:8px;text-align:center;padding:.2rem 0;font-weight:800}
.chave div small{display:block;color:var(--vermelho);font-size:.95rem}
.codigo{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.codigo span{width:3rem;height:3.4rem;border-radius:10px;background:var(--verde);color:var(--ouro2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:1.4rem;font-weight:800;box-shadow:0 4px 0 #063a24}

/* certificado */
.cert{border:10px double var(--ouro);text-align:center;padding:2rem 1.2rem}
.cert .nome-c{font-family:'Cinzel Decorative',serif;font-size:2.1rem;color:var(--vermelho);margin:.3rem 0}
.selos-grandes{font-size:2.4rem;letter-spacing:.4rem}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;visibility:hidden;transition:all .35s;background:#2d1e0f;color:#fff;
  padding:.8rem 1.2rem;border-radius:14px;font-weight:800;z-index:50;border:3px solid var(--ouro);max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}

.confete{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(720deg)}}

.selo-ganho{font-size:5rem;animation:pop .6s}
.nota{font-size:.88rem;opacity:.85}
.linha-bts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}

@media print{
  body{background:#fff}
  #barra,.linha-bts,.nao-imprimir{display:none!important}
  .perg{box-shadow:none}
}
</style>
</head>
<body>
<div id="barra" style="display:none">
  <div class="quem"><span class="av" id="b-av">🗡️</span><span id="b-nome"></span></div>
  <span class="pts">⭐ <span id="b-pts">0</span></span>
  <span class="selos" id="b-selos"></span>
  <span class="esp"></span>
  <button class="bt-ic" id="b-som" title="Ligar/desligar efeitos sonoros">🔊 Sons</button>
  <button class="bt-ic" id="b-mus" title="Ligar/desligar música">🎵 Música</button>
  <button class="bt-ic" id="b-mapa" title="Voltar ao mapa">🗺️ Mapa</button>
</div>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ======================== DADOS ======================== */
const MISSOES = [
  {id:'m1', ic:'📜', selo:'📜', titulo:'A Crónica do Reino', desc:'Descobre como Portugal perdeu e recuperou a independência.'},
  {id:'m2', ic:'⏳', selo:'⏳', titulo:'A Linha do Tempo', desc:'Põe os acontecimentos pela ordem certa.'},
  {id:'m3', ic:'🎭', selo:'🎭', titulo:'Quem é Quem?', desc:'Jogo da memória com as personagens da história.'},
  {id:'m4', ic:'🏰', selo:'🗝️', titulo:'Assalto ao Paço da Ribeira', desc:'Responde depressa e sobe a escadaria do palácio!'},
  {id:'m5', ic:'🐂', selo:'🐂', titulo:'A Batalha da Salga', desc:'Os Açores também entram na história! Solta os touros.'}
];

const CRONICA = [
  {ano:'1578', ic:'⚔️', titulo:'O rei que não voltou',
   texto:'O jovem rei <b>D. Sebastião</b> partiu com um grande exército para o Norte de África. Na <b>Batalha de Alcácer-Quibir</b>, em 1578, os portugueses foram derrotados e o rei desapareceu. D. Sebastião não tinha filhos… Quem iria agora governar Portugal?',
   p:{q:'Porque ficou Portugal com um grande problema depois de 1578?', ops:['O rei desapareceu e não tinha filhos','O rei mudou-se para Espanha','O rei proibiu as festas'], c:0}},
  {ano:'1580', ic:'👑', titulo:'Três candidatos ao trono',
   texto:'Governou o tio-avô, o idoso <b>Cardeal D. Henrique</b>, que morreu em 1580. Apareceram três candidatos: <b>Filipe II de Espanha</b>, <b>D. António, Prior do Crato</b>, e <b>D. Catarina, Duquesa de Bragança</b>. Filipe II enviou um exército, venceu os apoiantes de D. António na <b>Batalha de Alcântara</b> e ficou com a coroa.',
   p:{q:'Qual dos candidatos ficou com a coroa portuguesa?', ops:['D. António, Prior do Crato','Filipe II de Espanha','D. Catarina de Bragança'], c:1}},
  {ano:'1581', ic:'📜', titulo:'Dois reinos, um só rei',
   texto:'Nas <b>Cortes de Tomar</b>, em 1581, Filipe II de Espanha foi aclamado rei de Portugal com o nome de <b>Filipe I</b>. Prometeu respeitar as leis, a língua e a moeda portuguesas. Começava a <b>Dinastia Filipina</b>: três reis Filipes governaram Portugal durante <b>60 anos</b>.',
   p:{q:'Quanto tempo durou a Dinastia Filipina?', ops:['10 anos','60 anos','200 anos'], c:1}},
  {ano:'1581', ic:'🐂', titulo:'Os Açores resistem!',
   texto:'A ilha <b>Terceira</b>, nos Açores, não aceitou Filipe II e apoiou D. António. Na <b>Batalha da Salga</b> (1581), os terceirenses lançaram <b>gado bravo</b> contra os soldados espanhóis e venceram! Só em <b>1583</b> os espanhóis conseguiram conquistar a ilha.',
   p:{q:'Que “arma” especial usaram os terceirenses na Batalha da Salga?', ops:['Canhões gigantes','Gado bravo (touros e vacas)','Barcos de fogo'], c:1}},
  {ano:'1621–1640', ic:'😠', titulo:'O povo está descontente',
   texto:'Com <b>Filipe III</b> e o seu poderoso ministro, o <b>Conde-Duque de Olivares</b>, as promessas foram esquecidas: os impostos aumentaram, havia castelhanos em cargos importantes e os inimigos de Espanha atacavam as terras portuguesas no Brasil e no Oriente. Em 1637 houve revoltas em <b>Évora</b>. Em 1640, a <b>Catalunha</b> revoltou-se e os nobres portugueses foram chamados para combater lá.',
   p:{q:'Qual destes motivos deixou os portugueses descontentes?', ops:['O aumento dos impostos','A descoberta do Brasil','A construção do Mosteiro dos Jerónimos'], c:0}},
  {ano:'1640', ic:'🤫', titulo:'A conspiração',
   texto:'Um grupo de nobres, os <b>Conjurados</b> (conhecidos como os “Quarenta Conjurados”), reunia-se em segredo, por exemplo no palácio de <b>D. Antão de Almada</b>. Escolheram para rei o <b>Duque de Bragança, D. João</b>. Conta-se que a sua mulher, <b>D. Luísa de Gusmão</b>, o encorajou: “Antes rainha por um dia do que duquesa toda a vida!”',
   p:{q:'Quem foi escolhido pelos conjurados para ser o novo rei?', ops:['D. Antão de Almada','O Duque de Bragança, D. João','O Conde-Duque de Olivares'], c:1}},
  {ano:'1 dez. 1640', ic:'🏰', titulo:'A manhã da liberdade',
   texto:'Na manhã de sábado, <b>1 de dezembro de 1640</b>, os conjurados entraram no <b>Paço da Ribeira</b>, em Lisboa. <b>Miguel de Vasconcelos</b>, o odiado secretário de Estado, foi morto e atirado pela janela. A vice-rainha, a <b>Duquesa de Mântua</b>, teve de se render. Da janela, <b>D. Miguel de Almeida</b> gritou ao povo: “Liberdade! Viva El-Rei D. João IV!”',
   p:{q:'Em que palácio de Lisboa entraram os conjurados?', ops:['Paço da Ribeira','Palácio de Belém','Castelo de Guimarães'], c:0}},
  {ano:'1640–1668', ic:'🛡️', titulo:'Rei novo, guerra longa',
   texto:'A <b>15 de dezembro de 1640</b>, D. João IV foi aclamado rei: começava a <b>4.ª Dinastia, a de Bragança</b>. Seguiu-se a <b>Guerra da Restauração</b>, que durou 28 anos. Só em <b>1668</b>, no <b>Tratado de Lisboa</b>, a Espanha reconheceu a independência de Portugal. Hoje, o <b>1.º de Dezembro é feriado nacional</b> e em Lisboa há o <b>Monumento aos Restauradores</b>.',
   p:{q:'Em que ano a Espanha reconheceu a independência de Portugal?', ops:['1640','1580','1668'], c:2}}
];

const EVENTOS = [
  {e:'⚔️', t:'D. Sebastião desaparece em Alcácer-Quibir', d:'1578'},
  {e:'👑', t:'Filipe II de Espanha vence na Batalha de Alcântara', d:'1580'},
  {e:'🏝️', t:'Os espanhóis conquistam a ilha Terceira', d:'1583'},
  {e:'🔥', t:'Revoltas de Évora contra os impostos', d:'1637'},
  {e:'🏰', t:'Os conjurados entram no Paço da Ribeira', d:'1 de dezembro de 1640'},
  {e:'👑', t:'D. João IV é aclamado rei', d:'15 de dezembro de 1640'},
  {e:'🛡️', t:'Os espanhóis do castelo de Angra rendem-se', d:'1642'},
  {e:'🤝', t:'Tratado de Lisboa: a Espanha reconhece a independência', d:'1668'}
];

let actx=null, master=null, somOn=true, musOn=false;
function ac(){
  try{
    if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); master = actx.createGain(); master.gain.value=.9; master.connect(actx.destination); }
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
  return actx;
}
function tom(f, dur, tipo='sine', vol=.2, quando=0, glide=null, destino=null){
  const c=ac(); if(!c) return;
  const t=c.currentTime+quando, o=c.createOscillator(), g=c.createGain();
  o.type=tipo; o.frequency.setValueAtTime(f,t);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide, t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(destino||master); o.start(t); o.stop(t+dur+.05);
}
function ruido(dur, vol=.2, quando=0, filtro='highpass', freq=1000){
  const c=ac(); if(!c) return;
  const t=c.currentTime+quando, n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=b; f.type=filtro; f.frequency.value=freq; g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function trompete(f, dur, quando=0, vol=.13){
  const c=ac(); if(!c) return;
  const t=c.currentTime+quando, o=c.createOscillator(), o2=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain();
  o.type='sawtooth'; o2.type='square'; o.frequency.value=f; o2.frequency.value=f*1.003;
  lp.type='lowpass'; lp.frequency.setValueAtTime(600,t); lp.frequency.linearRampToValueAtTime(2600,t+.06); lp.frequency.linearRampToValueAtTime(1500,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.04); g.gain.setValueAtTime(vol*.85,t+dur*.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
}
const SFX = {
  clique(){ tom(880,.06,'square',.06); },
  certo(){ tom(784,.12,'triangle',.22); tom(1047,.25,'triangle',.22,.1); tom(1568,.3,'sine',.08,.1); },
  errado(){ tom(196,.35,'sawtooth',.12,0,120); tom(185,.35,'square',.05,0,110); },
  virar(){ ruido(.18,.25,0,'bandpass',2500); },
  moeda(){ tom(988,.08,'square',.08); tom(1319,.25,'square',.08,.08); },
  tique(){ tom(1500,.04,'square',.05); },
  espada(){ ruido(.35,.35,0,'highpass',3000); tom(2400,.5,'triangle',.06,0,1800); tom(3100,.45,'sine',.04); },
  tambor(){ for(let i=0;i<10;i++) ruido(.08,.25,i*.06,'lowpass',400); ruido(.4,.5,.62,'lowpass',250); tom(70,.4,'sine',.5,.62,40); },
  muu(){ const c=ac(); if(!c) return; tom(180,.9,'sawtooth',.12,0,120); tom(90,.9,'sine',.2,0,70); },
  galope(){ for(let i=0;i<6;i++){ ruido(.05,.3,i*.13,'lowpass',500); ruido(.05,.2,i*.13+.06,'lowpass',700);} },
  fanfarra(){ const n=[523,659,784,1047]; n.forEach((f,i)=>trompete(f,.18,i*.14)); trompete(784,.18,.62); trompete(1047,.7,.78,.16); trompete(523,.7,.78,.08); },
  vitoria(){ this.tambor(); setTimeout(()=>{ const s=[[523,.15],[523,.15],[523,.15],[659,.45],[587,.15],[659,.15],[784,.8]]; let t=0; s.forEach(([f,d])=>{trompete(f,d,t); trompete(f/2,d,t,.06); t+=d+.02;}); },900); },
  selo(){ tom(523,.15,'triangle',.2); tom(659,.15,'triangle',.2,.12); tom(784,.15,'triangle',.2,.24); tom(1047,.6,'triangle',.25,.36); tom(1319,.6,'sine',.08,.36); }
};

/* música de fundo original (alaúde + bordão), em ré menor */
let musTimer=null, musNext=0, musIdx=0, musGain=null;
const BPM=96, B=60/BPM;
const MELODIA = [ // [midi, tempos]
  [62,1],[65,1],[69,1.5],[67,.5],[65,1],[64,1],[62,2],
  [65,1],[67,1],[69,1],[70,1],[69,1.5],[67,.5],[65,2],
  [69,1],[72,1],[70,1],[69,1],[67,1],[65,1],[64,2],
  [62,1],[64,1],[65,1],[67,1],[65,1],[64,1],[62,2]
];
const BAIXO = [50,50,53,53,48,48,50,50, 53,53,55,55,57,57,53,53, 57,57,55,55,52,52,57,57, 50,50,48,48,45,45,50,50];
function midi(m){ return 440*Math.pow(2,(m-69)/12); }
function alaude(f,t,dur,vol){
  const c=actx, o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter();
  o.type='triangle'; o2.type='sawtooth'; o.frequency.value=f; o2.frequency.value=f;
  lp.type='lowpass'; lp.frequency.setValueAtTime(3000,t); lp.frequency.exponentialRampToValueAtTime(500,t+dur);
  const g2=c.createGain(); g2.gain.value=.25;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(0.0001,t+Math.min(dur*1.6,1.6));
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(musGain); o.start(t); o2.start(t); o.stop(t+2); o2.stop(t+2);
}
let baixoIdx=0, baixoNext=0;
function agendaMusica(){
  const c=actx; if(!c) return;
  while(musNext < c.currentTime+.4){
    const [m,d]=MELODIA[musIdx]; alaude(midi(m),musNext,d*B,.22);
    musNext += d*B; musIdx=(musIdx+1)%MELODIA.length;
  }
  while(baixoNext < c.currentTime+.4){
    alaude(midi(BAIXO[baixoIdx]),baixoNext,B,.16);
    baixoNext += B; baixoIdx=(baixoIdx+1)%BAIXO.length;
  }
}
function ligaMusica(on){
  musOn=on; atualizaBarra();
  const c=ac(); if(!c) return;
  if(on){
    if(!musGain){ musGain=c.createGain(); musGain.connect(master); }
    musGain.gain.setValueAtTime(.35,c.currentTime);
    musIdx=0; baixoIdx=0; musNext=baixoNext=c.currentTime+.1;
    clearInterval(musTimer); musTimer=setInterval(agendaMusica,100);
  }else{
    clearInterval(musTimer); musTimer=null;
    if(musGain){ musGain.gain.setValueAtTime(0,c.currentTime); musGain.disconnect(); musGain=null; }
  }
}

/* narração (voz do navegador) */
let vozes=[];
function carregaVozes(){ try{ vozes=speechSynthesis.getVoices(); }catch(e){} }
if('speechSynthesis' in window){ carregaVozes(); speechSynthesis.onvoiceschanged=carregaVozes; }
function limpaTexto(h){ const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/[“”]/g,'"'); }
function falar(txt){
  if(!('speechSynthesis' in window)){ toast('Este navegador não consegue ler em voz alta.'); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(limpaTexto(txt)); u.lang='pt-PT'; u.rate=.95;
    const v=vozes.find(v=>v.lang==='pt-PT'||v.lang==='pt_PT')||vozes.find(v=>/^pt/i.test(v.lang));
    if(v) u.voice=v;
    if(musGain && actx){ musGain.gain.setTargetAtTime(.08,actx.currentTime,.2); u.onend=()=>{ if(musGain) musGain.gain.setTargetAtTime(.35,actx.currentTime,.3); }; }
    speechSynthesis.speak(u);
  }catch(e){}
}
function calar(){ try{ speechSynthesis.cancel(); }catch(e){} }

      <div class="pergunta">
        <div class="q">🔐 Para virar a página: ${p.p.q} <button class="bt-ouvir" id="ouvirq" aria-label="ouvir pergunta">🔊</button></div>
        <div class="opcoes">${p.p.ops.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="linha-bts"><button class="bt" id="prox" style="display:none">Virar a página ▶</button></div>
    </div>`;
    $('#ouvir').onclick=()=>falar(`${p.ano}. ${p.titulo}. ${p.texto}`);
    $('#ouvirq').onclick=()=>falar(p.p.q+' '+p.p.ops.join('? ')+'?');
    app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(k===p.p.c){
        b.classList.add('certa'); app.querySelectorAll('.op').forEach(x=>x.disabled=true);
        const g=tent===0?10:5; addPts(g); acertos+= tent===0?1:0; som('certo');
        $('#fb').className='feedback ok'; $('#fb').textContent=`✔️ Muito bem! +${g} pontos`;
        $('#prox').style.display=''; $('#prox').textContent = i===CRONICA.length-1?'Terminar a crónica 🏁':'Virar a página ▶';
      }else{
        tent++; b.classList.add('errada'); b.disabled=true; som('errado');
        $('#fb').className='feedback ko'; $('#fb').textContent='✖️ Ainda não… relê o texto e tenta outra vez!';
      }
    });
    $('#prox').onclick=()=>{ som('virar'); i++; if(i<CRONICA.length){ pagina(); window.scrollTo({top:0,behavior:'smooth'}); } else ganharSelo('m1',20,`Leste a crónica toda e acertaste ${acertos} de ${CRONICA.length} perguntas à primeira!`); };
  }
  pagina();
}

/* ---------- Missão 2: Linha do tempo ---------- */
function missaoLinha(){
  const m=MISSOES[1]; let prox=0, erros=0;
  const cartas=baralha(EVENTOS.map((e,i)=>({...e,i})));
  app.innerHTML=`<div class="perg">${cabecalho(m,`<span class="cinzel" id="cont">0/${EVENTOS.length}</span>`)}
    <p style="font-size:1.05rem">Clica nos acontecimentos <b>do mais antigo para o mais recente</b>. Cada um vai ocupar o seu lugar na linha do tempo. <button class="bt-ouvir" id="ouvir">🔊 Ouvir</button></p>
    <div class="slots">${EVENTOS.map((e,i)=>`<div class="slot" id="s${i}"><span class="num">${i+1}</span></div>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="baralho">${cartas.map(c=>`<button class="ev" data-i="${c.i}"><span class="e">${c.e}</span>${c.t}</button>`).join('')}</div>
  </div>`;
  $('#ouvir').onclick=()=>falar('Clica nos acontecimentos do mais antigo para o mais recente. '+cartas.map(c=>c.t).join('. '));
  app.querySelectorAll('.ev').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===prox){
      som('certo'); addPts(10);
      const e=EVENTOS[i], s=$('#s'+i);
      s.classList.add('cheio'); s.innerHTML=`<span class="data">${e.d}</span><span>${e.e} ${e.t}</span>`;
      b.remove(); prox++; $('#cont').textContent=`${prox}/${EVENTOS.length}`;
      $('#fb').className='feedback ok'; $('#fb').textContent='✔️ Certo! +10';
      if(prox===EVENTOS.length){
        const bonus=Math.max(5,30-erros*5);
        setTimeout(()=>ganharSelo('m2',bonus,`Construíste a linha do tempo de 1578 a 1668 com ${erros} ${erros===1?'erro':'erros'}.`),1300);
      }
    }else{
      erros++; som('errado'); addPts(-2); b.classList.add('abanar'); setTimeout(()=>b.classList.remove('abanar'),400);
      $('#fb').className='feedback ko';
      $('#fb').textContent = i<prox ? '✖️ Esse já devia estar colocado…' : '✖️ Ainda não! Há um acontecimento mais antigo do que esse.';
    }
  });
}

/* ---------- Missão 3: Memória ---------- */
function missaoMemoria(){
  const m=MISSOES[2]; let abertas=[], bloqueio=false, feitas=0, jogadas=0;
  const cartas=baralha(PARES.flatMap(p=>[
    {id:p.id, tipo:'pessoa', html:`<span class="em">${p.emAlt||p.em}</span>${p.nome}`},
    {id:p.id, tipo:'pista', html:`<span class="em" style="font-size:1.4rem">📜</span>${p.pista}`}
  ]));
  app.innerHTML=`<div class="perg">${cabecalho(m,`<span class="cinzel">Pares: <span id="pf">0</span>/8 · Jogadas: <span id="jg">0</span></span>`)}
    <p style="font-size:1.05rem">Vira duas cartas de cada vez. Junta cada <b>personagem</b> à sua <b>pista</b>! <button class="bt-ouvir" id="ouvir">🔊 Ouvir</button></p>
    <div class="memoria">${cartas.map((c,k)=>`<button class="carta ${c.tipo}" data-k="${k}" aria-label="carta"><div class="face verso">⚜️</div><div class="face frente">${c.html}</div></button>`).join('')}</div>
    <div class="info-par" id="info">💡 Quando encontrares um par, aparece aqui uma curiosidade.</div>
  </div>`;
  $('#ouvir').onclick=()=>falar('Vira duas cartas de cada vez. Junta cada personagem à sua pista!');
  const els=[...app.querySelectorAll('.carta')];
  els.forEach(el=>el.onclick=()=>{
    if(bloqueio||el.classList.contains('virada')||el.classList.contains('feita')) return;
    som('virar'); el.classList.add('virada'); abertas.push(el);
    if(abertas.length===2){
      jogadas++; $('#jg').textContent=jogadas;
      const [a,b]=abertas.map(x=>cartas[+x.dataset.k]);
      if(a.id===b.id && a.tipo!==b.tipo){
        abertas.forEach(x=>{x.classList.remove('virada');x.classList.add('feita');});
        abertas=[]; feitas++; $('#pf').textContent=feitas; addPts(10);
        setTimeout(()=>som('certo'),250);
        const p=PARES.find(x=>x.id===a.id);
        $('#info').innerHTML=`<b>${p.nome}:</b> ${INFO_PARES[p.id]} <button class="bt-ouvir" id="oi">🔊</button>`;
        $('#oi').onclick=()=>falar(p.nome+'. '+INFO_PARES[p.id]);
        if(feitas===8){
          const bonus=Math.max(5,40-Math.max(0,jogadas-8)*2);
          setTimeout(()=>ganharSelo('m3',bonus,`Encontraste os 8 pares em ${jogadas} jogadas.`),1800);
        }
      }else{
        bloqueio=true;
        setTimeout(()=>{ som('errado'); },350);
        setTimeout(()=>{ abertas.forEach(x=>x.classList.remove('virada')); abertas=[]; bloqueio=false; },1100);
      }
    }
  });
}

/* ---------- Missão 4: Paço da Ribeira ---------- */
function missaoPaco(){
  const m=MISSOES[3]; const TOTAL=10, TEMPO=20;
  const qs=baralha(PERGUNTAS_PACO).slice(0,TOTAL).map(q=>{ const ord=baralha(q.ops.map((o,k)=>({o,k}))); return {q:q.q, ops:ord.map(x=>x.o), c:ord.findIndex(x=>x.k===q.c)}; });
  let i=0, vidas=3, t=TEMPO, timer=null, certas=0;
  limpezas.push(()=>clearInterval(timer));
  app.innerHTML=`<div class="perg">${cabecalho(m,`<span class="vidas" id="vidas">❤️❤️❤️</span>`)}
    <p style="font-size:1.02rem">Os conjurados sobem a escadaria do <b>Paço da Ribeira</b>! Cada resposta certa é um degrau. Tens <b>3 vidas</b> e <b>${TEMPO} segundos</b> por pergunta.</p>
    <div class="paco">
      <div class="escadaria" id="esc"><span class="porta" id="porta">🚪</span><span class="boneco" id="bon">${S.av}</span></div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center"><b class="cinzel">Pergunta <span id="qn">1</span>/${TOTAL}</b><span class="relogio">⏱️ <span id="tt">${TEMPO}</span>s</span></div>
        <div class="barra-tempo"><div id="bt" style="width:100%"></div></div>
        <div class="pergunta" style="margin-top:0"><div class="q" id="q"></div><div class="opcoes" id="ops"></div><div class="feedback" id="fb"></div></div>
      </div>
    </div></div>`;
  const esc=$('#esc');
  for(let d=0; d<TOTAL; d++){ const s=document.createElement('div'); s.className='degrau'; s.style.left=(d*9)+'%'; s.style.width=(100-d*9)+'%'; s.style.bottom=(d*8)+'%'; esc.appendChild(s); }
  function posBoneco(){ const b=$('#bon'); b.style.left=(certas*8.4+2)+'%'; b.style.bottom=(certas*8+1)+'%'; }
  posBoneco();
  function mostra(){
    const q=qs[i]; t=TEMPO; $('#qn').textContent=i+1; $('#tt').textContent=t; $('#bt').style.width='100%';
    $('#q').innerHTML=`${q.q} <button class="bt-ouvir" id="oq">🔊</button>`; $('#fb').textContent='';
    $('#oq').onclick=()=>falar(q.q+' '+q.ops.join('? ')+'?');
    $('#ops').innerHTML=q.ops.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join('');
    app.querySelectorAll('#ops .op').forEach(b=>b.onclick=()=>responde(+b.dataset.k,b));
    clearInterval(timer);
    timer=setInterval(()=>{ t--; $('#tt').textContent=t; $('#bt').style.width=(t/TEMPO*100)+'%'; if(t<=5&&t>0) som('tique'); if(t<=0){ clearInterval(timer); responde(-1,null); } },1000);
  }
  function responde(k,b){
    clearInterval(timer); const q=qs[i];
    app.querySelectorAll('#ops .op').forEach((x,j)=>{ x.disabled=true; if(j===q.c) x.classList.add('certa'); });
    if(k===q.c){
      certas++; addPts(10+Math.ceil(t/4)); som('espada'); posBoneco();
      $('#fb').className='feedback ok'; $('#fb').textContent=`⚔️ Certo! Subiste um degrau. (+${10+Math.ceil(t/4)})`;
    }else{
      if(b) b.classList.add('errada');
      vidas--; som('errado'); $('#vidas').textContent='❤️'.repeat(vidas)+'🖤'.repeat(3-vidas);
      $('#fb').className='feedback ko'; $('#fb').textContent= k===-1?'⏰ O tempo acabou! Perdeste uma vida.':'✖️ Errado! Perdeste uma vida.';
    }
    setTimeout(()=>{
      if(vidas<=0) return fim(false);
      i++; if(i<TOTAL) mostra(); else fim(true);
    },1600);
  }
  function fim(ok){
    clearInterval(timer);
    if(ok){
      $('#porta').textContent='🎉';
      som('tambor'); setTimeout(()=>falar('Liberdade! Liberdade! Viva El-Rei D. João Quarto!'),900);
      setTimeout(()=>ganharSelo('m4',certas*3,`Chegaste ao topo da escadaria com ${certas} respostas certas e ${vidas} ${vidas===1?'vida':'vidas'}. “Liberdade! Viva El-Rei D. João IV!”`),3200);
    }else{
      app.innerHTML=`<div class="perg centro"><div style="font-size:4rem">🛡️</div><h2 class="cinzel" style="color:var(--vermelho)">Os guardas travaram-te!</h2>
        <p style="font-size:1.1rem">Ficaste sem vidas na escadaria do Paço. Os conjurados não desistem: tenta outra vez!</p>
        <div class="linha-bts"><button class="bt verm" id="rep">🔁 Tentar de novo</button><button class="bt cinza" id="vm">🗺️ Mapa</button></div></div>`;
      $('#rep').onclick=()=>{ som('clique'); abrir('m4'); }; $('#vm').onclick=()=>{ som('clique'); mapa(); };
    }
  }
  mostra();
}

/* ---------- Missão 5: Salga ---------- */
function missaoSalga(){
  const m=MISSOES[4]; const af=baralha(AFIRMACOES);
  let i=0, soldados=6, avanco=0, certas=0, ocupado=false;
  const posY=[4,19,34,49,64,79];
  app.innerHTML=`<div class="perg">${cabecalho(m,`<span class="cinzel">Soldados: <span id="ns">6</span> · Avanço: <span id="av">0</span>/3</span>`)}
    <p style="font-size:1.02rem">Ilha Terceira, 1581. Os soldados espanhóis desembarcaram na baía da Salga! Responde <b>Verdadeiro</b> ou <b>Falso</b>.
    Se acertares, os touros carregam 🐂 e expulsam um soldado. Se errares, os soldados avançam. Expulsa os 6 antes que cheguem à aldeia! <button class="bt-ouvir" id="ouvir">🔊 Ouvir</button></p>
    <div class="praia" id="praia"><div class="onda"></div><span class="navio">⛵</span>
      <div class="aldeia">🏘️<small>Aldeia</small></div>
    </div>
    <div class="afirmacao" id="af"></div>
    <div class="vf"><button class="bt" id="bv">✔️ Verdadeiro</button><button class="bt verm" id="bf">✖️ Falso</button></div>
    <div class="feedback centro" id="fb"></div>
  </div>`;
  $('#ouvir').onclick=()=>falar('Responde verdadeiro ou falso. Se acertares, os touros expulsam um soldado. '+limpaTexto(af[i].t));
  const praia=$('#praia');
  for(let k=0;k<6;k++){ const s=document.createElement('span'); s.className='soldado'; s.id='sd'+k; s.textContent='💂'; s.style.top=posY[k]+'%'; s.style.left=(24+(k%2)*5)+'%'; praia.appendChild(s); }
  function posSoldados(){ for(let k=0;k<6;k++){ const s=$('#sd'+k); if(s && !s.classList.contains('fora')) s.style.left=(24+(k%2)*5+avanco*10)+'%'; } }
  function mostra(){ $('#af').textContent=af[i].t; ocupado=false; }
  function responde(v){
    if(ocupado) return; ocupado=true;
    const a=af[i];
    if(v===a.v){
      certas++; addPts(10); som('muu'); setTimeout(()=>som('galope'),300);
      const touro=document.createElement('span'); touro.className='touro'; touro.textContent='🐂'; touro.style.top=posY[6-soldados]+'%'; praia.appendChild(touro);
      requestAnimationFrame(()=>touro.classList.add('ataca'));
      setTimeout(()=>{ const s=$('#sd'+(6-soldados)); if(s) s.classList.add('fora'); soldados--; $('#ns').textContent=soldados; touro.remove(); },700);
      $('#fb').className='feedback ok centro'; $('#fb').textContent='🐂 Certo! Os touros carregam! +10'+(a.exp?' — '+a.exp:'');
    }else{
      avanco++; som('errado'); setTimeout(()=>som('tambor'),200); posSoldados(); $('#av').textContent=avanco;
      $('#fb').className='feedback ko centro'; $('#fb').textContent='✖️ Errado! Os soldados avançam. '+(a.exp||(a.v?'Esta afirmação era verdadeira.':'Esta afirmação era falsa.'));
    }
    setTimeout(()=>{
      if(soldados<=0) return ganharSelo('m5',25-avanco*5,`Os soldados fugiram para os barcos! Tal como em 1581, a Terceira venceu na Salga. Acertaste ${certas} afirmações.`);
      if(avanco>=3) return perdeu();
      i++; if(i>=af.length) return perdeu();
      mostra();
    },2400);
  }
  function perdeu(){
    app.innerHTML=`<div class="perg centro"><div style="font-size:4rem">🏘️💂</div><h2 class="cinzel" style="color:var(--vermelho)">Os soldados chegaram à aldeia!</h2>
      <p style="font-size:1.1rem">Desta vez não conseguiste. Relê a página «Os Açores resistem!» na Crónica e tenta outra vez.</p>
      <div class="linha-bts"><button class="bt verm" id="rep">🔁 Tentar de novo</button><button class="bt cinza" id="vm">🗺️ Mapa</button></div></div>`;
    $('#rep').onclick=()=>{ som('clique'); abrir('m5'); }; $('#vm').onclick=()=>{ som('clique'); mapa(); };
  }
  $('#bv').onclick=()=>responde(true); $('#bf').onclick=()=>responde(false);
  mostra();
}

/* ---------- Missão final ---------- */
function missaoFinal(){
  const letras='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const cod=SEGREDO.split('').map(l=>letras.indexOf(l)+1);
  app.innerHTML=`<div class="perg">
    <div class="cab-missao"><span style="font-size:2.2rem">🔐</span><h2>A Mensagem Secreta</h2></div>
    <p style="font-size:1.08rem">Os conjurados comunicavam em segredo. Usa a <b>chave</b> para descobrir a palavra que D. Miguel de Almeida gritou da janela do Paço! <button class="bt-ouvir" id="ouvir">🔊 Ouvir</button></p>
    <div class="chave">${letras.map((l,k)=>`<div>${l}<small>${k+1}</small></div>`).join('')}</div>
    <div class="codigo">${cod.map(n=>`<span>${n}</span>`).join('')}</div>
    <div class="centro"><input class="nome" id="resp" maxlength="20" placeholder="Escreve a palavra secreta" autocomplete="off">
    <div class="linha-bts"><button class="bt verm" id="ver">🔓 Abrir o segredo</button></div>
    <div class="feedback" id="fb"></div></div>
  </div>`;
  $('#ouvir').onclick=()=>falar('Usa a chave: cada número corresponde a uma letra. Os números são: '+cod.join(', '));
  const tenta=()=>{
    const r=$('#resp').value.trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(r===SEGREDO){ if(!S.fim){ addPts(50); } S.fim=true; guardar(); som('vitoria'); confetes(160); setTimeout(()=>falar('Liberdade! Parabéns, '+S.nome+'! És um conjurado de honra da Restauração!'),2600); certificado(); }
    else{ som('errado'); $('#fb').className='feedback ko'; $('#fb').textContent='✖️ Não é essa… Confirma cada número na chave!'; $('#resp').classList.add('abanar'); setTimeout(()=>$('#resp').classList.remove('abanar'),400); }
  };
  $('#ver').onclick=tenta; $('#resp').onkeydown=e=>{ if(e.key==='Enter') tenta(); };
}

function certificado(){
  const hoje=new Date().toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`<div class="perg cert">
    <div style="font-size:3rem">🛡️</div>
    <div class="cinzel" style="font-size:1.1rem;letter-spacing:.15rem">CERTIFICADO DE</div>
    <h1 class="titulo" style="color:var(--verde);margin:.2rem 0">Conjurado de Honra</h1>
    <div class="cinzel">da Restauração da Independência</div>
    <p style="margin-top:1.2rem">Certifica-se que</p>
    <div class="nome-c">${S.av} ${S.nome.replace(/</g,'&lt;')}</div>
    <p style="font-size:1.1rem;max-width:560px;margin:.5rem auto">cumpriu todas as missões dos Conjurados de 1640, decifrou a mensagem secreta
    e ajudou a devolver a independência a Portugal, gritando bem alto: <b>«LIBERDADE!»</b></p>
    <div class="selos-grandes">${MISSOES.map(m=>m.selo).join('')}</div>
    <p style="font-size:1.3rem"><b>⭐ ${S.pts} pontos</b></p>
    <p class="cinzel">Lisboa, 1 de dezembro de 1640 · ${hoje}</p>
    <div class="linha-bts"><button class="bt ouro" id="imp">🖨️ Imprimir certificado</button><button class="bt" id="vm">🗺️ Mapa</button><button class="bt cinza" id="nv">🔁 Novo jogo</button></div>
  </div>`;
  $('#imp').onclick=()=>{ try{ window.print(); }catch(e){ toast('Para imprimir, abre a atividade numa janela própria.'); } };
  $('#vm').onclick=()=>{ som('clique'); mapa(); };
  $('#nv').onclick=()=>{ S={nome:'',av:'🗡️',pts:0,selos:{},fim:false}; guardar(); inicio(); };
}

inicio();
</script>
